                <section class="intro-section">
                    <h1>今天怎么开始跑步？</h1>
                    <p1 class="page-desc">Not limited by the past, nor confined to this moment.</p1>

                <section class="entry-section">
                    <a href="route-setup.html" class="entry-card launch-card">
                        <div class="entry-content">
                            <h2>设置目的地</h2>
                            <p>输入目的地，生成最佳路线后开始导航。</p>
                        </div>
                        <div class="entry-action">
                            <span class="entry-btn">开始规划</span>
                        </div>
                    </a>

                    <a href="session.html" class="entry-card freerun-card">
                        <div class="entry-content">
                            <h2>自由开跑</h2>
                            <p>不设置目的地，直接进入实时地图并记录当前位置。</p>
                        </div>
                        <div class="entry-action">
                            <span class="entry-btn mid-btn">立即开始</span>
                        </div>
                    </a>

                    <a href="join.html" class="entry-card join-card">
                        <div class="entry-content">
                            <h2>碰一碰加入</h2>
                            <p>加入附近正在进行中的跑步会话，地图同步显示大家位置。</p>
                        </div>
                        <div class="entry-action">
                            <span class="entry-btn light-btn">立即加入</span>
                        </div>
