<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerRun - Live Running</title>
    <link rel="stylesheet" href="running.css">
</head>
<body>
    <div class="app-shell">
        <div class="phone-frame">
            <div class="run-page">
                <header class="top-bar">
                    <a href="index.html" class="icon-btn back-link" aria-label="返回首页">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>

                    <div class="search-bar">
                        <span class="search-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/>
                                <path d="M16 16L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </span>
                        <input id="searchInput" type="text" placeholder="输入目的地，生成最佳路线" autocomplete="off">
                    </div>
                </header>

                <section class="status-strip">
                    <span class="mode-pill" id="modePill">自由开跑</span>
                    <div class="status-copy">
                        <strong id="routeTitle">当前位置准备完成</strong>
                        <p id="routeNote">未输入目的地时，将直接从当前位置开始记录。</p>
                    </div>
                    <span class="route-badge" id="routeStatus">定位中</span>
                </section>

                <section class="map-card">
                    <div id="mapContainer" class="map-container"></div>

                    <div class="map-float-btns left-floats">
                        <button class="map-float-btn" id="musicBtn" aria-label="音乐控制">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M9 18V7.5L19 5V15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="7" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
                                <circle cx="17" cy="15.5" r="3" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>

                    <div class="map-float-btns right-floats">
                        <button class="map-float-btn sos-btn" id="sosBtn" aria-label="紧急呼救">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M12 3L19.5 6V11.5C19.5 16.3 16.4 20.7 12 22C7.6 20.7 4.5 16.3 4.5 11.5V6L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                <path d="M9.5 12H14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M12 9.5V14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>

                        <button class="map-float-btn" id="relocateBtn" aria-label="重新定位">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <circle cx="12" cy="12" r="6.5" stroke="currentColor" stroke-width="2"/>
                                <path d="M12 2V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M12 19V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M2 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M19 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>

                    <div class="map-overlay-info">
                        <span id="routeMetaText">未规划路线</span>
                    </div>
                </section>

                <section class="control-panel">
                    <div class="stats-row">
                        <article class="stat-item">
                            <span class="stat-label">Heart Rate</span>
                            <strong id="heartRateValue">98</strong>
                            <span class="stat-unit">bpm</span>
                        </article>

                        <article class="stat-item">
                            <span class="stat-label">Distance</span>
                            <strong id="distanceValue">0.00</strong>
                            <span class="stat-unit">km</span>
                        </article>

                        <article class="stat-item">
                            <span class="stat-label">Pace</span>
                            <strong id="paceValue">--</strong>
                            <span class="stat-unit">/km</span>
                        </article>
                    </div>

                    <div class="panel-meta">
                        <div class="meta-left">
                            <span class="meta-dot"></span>
                            <p id="musicStatusText">Music sync ready</p>
                        </div>
                        <div class="meta-right">
                            <p id="panelRouteText">自由开跑</p>
                        </div>
                    </div>

                    <div class="controls-row">
                        <button class="side-control" id="finishBtn" aria-label="结束跑步">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M7 4V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M8 5H17L15 9L17 13H8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            </svg>
                        </button>

                        <button class="main-run-btn" id="runToggleBtn" aria-label="开始或暂停跑步">
                            <span class="main-run-icon" id="runToggleIcon">
                                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <path d="M8 6.5V17.5L17 12L8 6.5Z"/>
                                </svg>
                            </span>
                            <span class="main-run-copy">
                                <strong id="runToggleLabel">Tap to Run</strong>
                                <small id="runToggleSub">自由开跑 / 路线跑</small>
                            </span>
                        </button>

                        <button class="side-control" id="pauseBtn" aria-label="暂停跑步">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M9 6V18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                                <path d="M15 6V18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        window._AMapSecurityConfig = {
            securityJsCode: "8ed5910bed83539406f0db94fc045e58"
        };
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=e19e79deaa0a8dabe01fda2b92b2d59e"></script>
    <script src="running.js"></script>
</body>
</html>
