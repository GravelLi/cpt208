<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerRun - Music</title>
    <link rel="stylesheet" href="music.css">
</head>
<body>
    <div class="app-shell">
        <div class="phone-frame">
            <div class="music-page">
                <header class="music-topbar">
                    <a href="running.html" class="icon-btn back-link" aria-label="Back to running">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>

                    <div class="music-title-wrap">
                        <span class="music-mini-label">Adaptive Playlist</span>
                        <h1>Run Music</h1>
                    </div>
                </header>

                <section class="hero-card">
                    <div class="hero-art">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M9 18V7.5L19 5V15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="7" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
                            <circle cx="17" cy="15.5" r="3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                </section>

                <section class="heart-guide-card">
                    <p id="heartGuideText">Current heart rate: 98 bpm · Recommended: Recovery</p>
                </section>

                <section class="category-tabs" id="categoryTabs">
                    <button class="category-tab active" data-category="recovery">Recovery</button>
                    <button class="category-tab" data-category="easy">Easy Flow</button>
                    <button class="category-tab" data-category="tempo">Tempo Push</button>
                    <button class="category-tab" data-category="sprint">Sprint Mode</button>
                </section>

                <section class="now-playing-card">
                    <div class="cover-art" id="coverArt">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M9 18V7.5L19 5V15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="7" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
                            <circle cx="17" cy="15.5" r="3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>

                    <div class="now-playing-copy">
                        <span class="now-playing-label">Now Playing</span>
                        <strong id="nowPlayingTitle">Not playing</strong>
                        <p id="nowPlayingMeta">Select a track below</p>
                    </div>
                </section>

                <section class="track-section">
                    <div class="section-head">
                        <strong id="trackSectionTitle">Recovery Playlist</strong>
                        <span id="trackCountText">4 tracks</span>
                    </div>

                    <div class="track-list" id="trackList"></div>
                </section>

                <section class="bottom-player">
                    <button class="player-control secondary" id="prevBtn" aria-label="Previous">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M7 6V18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M17 7L10 12L17 17V7Z" fill="currentColor"/>
                        </svg>
                    </button>

                    <button class="player-control primary" id="playPauseBtn" aria-label="Play or pause">
                        <span id="playPauseIcon">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M8 6.5V17.5L17 12L8 6.5Z"/>
                            </svg>
                        </span>
                    </button>

                    <button class="player-control secondary" id="nextBtn" aria-label="Next">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M17 6V18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M7 7L14 12L7 17V7Z" fill="currentColor"/>
                        </svg>
                    </button>
                </section>

                <audio id="musicPlayer" preload="none"></audio>
            </div>
        </div>
    </div>

    <script src="music.js"></script>
</body>
</html>
